name: Vendor Identity Live Smoke Test

on:
  push:
    branches:
      - testing/enterprise-readiness
    paths:
      - backend/tools/run_vendor_identity_live_smoke.txt

permissions:
  contents: read

concurrency:
  group: vendor-identity-live-smoke
  cancel-in-progress: false

jobs:
  identity-only-live-smoke:
    name: One Identity-Only Live Resolution
    runs-on: ubuntu-latest
    timeout-minutes: 7

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONPATH: .
      EXECUTION_MODE: real
      IDENTITY_SMOKE_VENDOR: ABC Trading

      BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
      BRIGHT_DATA_SERP_ZONE: ${{ vars.BRIGHT_DATA_SERP_ZONE }}
      BRIGHT_DATA_MCP_BASE_URL: ${{ vars.BRIGHT_DATA_MCP_BASE_URL || 'https://mcp.brightdata.com/mcp' }}
      BRIGHT_DATA_MCP_TOOLS: ${{ vars.BRIGHT_DATA_MCP_TOOLS }}
      BRIGHT_DATA_MCP_UNLOCKER_ZONE: ${{ vars.BRIGHT_DATA_MCP_UNLOCKER_ZONE }}
      BRIGHT_DATA_MCP_PRO: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify protected identity-search configuration
        run: |
          python - <<'PY'
          import os

          api_key = os.getenv(
              "BRIGHT_DATA_API_KEY",
              "",
          ).strip()
          serp_zone = os.getenv(
              "BRIGHT_DATA_SERP_ZONE",
              "",
          ).strip()
          mcp_base_url = os.getenv(
              "BRIGHT_DATA_MCP_BASE_URL",
              "",
          ).strip()
          mcp_tools = {
              item.strip()
              for item in os.getenv(
                  "BRIGHT_DATA_MCP_TOOLS",
                  "",
              ).split(",")
              if item.strip()
          }

          missing = []

          if not api_key:
              missing.append(
                  "BRIGHT_DATA_API_KEY"
              )

          if not serp_zone:
              missing.append(
                  "BRIGHT_DATA_SERP_ZONE"
              )

          if not mcp_base_url:
              missing.append(
                  "BRIGHT_DATA_MCP_BASE_URL"
              )

          if "search_engine" not in mcp_tools:
              missing.append(
                  "search_engine in BRIGHT_DATA_MCP_TOOLS"
              )

          if missing:
              raise SystemExit(
                  "Missing identity-search configuration: "
                  + ", ".join(missing)
              )

          if "token=" in mcp_base_url.lower():
              raise SystemExit(
                  "Do not store the API token inside "
                  "BRIGHT_DATA_MCP_BASE_URL."
              )

          print(
              "Protected identity-search configuration is present."
          )
          print("API token: protected and present")
          print("Planned SERP searches: 2")
          print("Planned Remote MCP search_engine calls: 1")
          print("Planned page scrapes: 0")
          print("Planned CrewAI/LLM calls: 0")
          print("Planned risk-scoring calls: 0")
          print("Planned database writes: 0")
          print("Planned investigation jobs: 0")
          PY

      - name: Run identity-only live smoke test
        run: python tools/vendor_identity_live_smoke_test.py

      - name: Upload identity smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vendor-identity-live-smoke
          path: backend/artifacts/vendor_identity_live_smoke.json
          if-no-files-found: ignore
          retention-days: 7
