name: Apply Speechmatics Realtime Integration

on:
  push:
    branches:
      - testing/enterprise-readiness
    paths:
      - frontend/tools/run_apply_speechmatics_integration.txt

permissions:
  contents: write

concurrency:
  group: apply-speechmatics-realtime-integration
  cancel-in-progress: false

jobs:
  integrate-speechmatics:
    name: Secure Voice Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out enterprise branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply focused Speechmatics patch
        run: python frontend/tools/apply_speechmatics_integration.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install official Speechmatics client
        working-directory: frontend
        run: npm install @speechmatics/real-time-client@latest --save-exact

      - name: Run the only required automated frontend check
        working-directory: frontend
        run: npm run build

      - name: Verify focused security properties
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("frontend")
          files = [
              root / "src/app/page.tsx",
              root / "src/lib/useSpeechmaticsVoice.ts",
              root / "src/app/api/speechmatics-token/route.ts",
              root / ".env.example",
          ]
          combined = "\n".join(
              path.read_text(encoding="utf-8")
              for path in files
          )

          checks = {
              "official client installed": (
                  "@speechmatics/real-time-client"
                  in (root / "package.json").read_text(encoding="utf-8")
              ),
              "server-only long-lived key": (
                  "process.env.SPEECHMATICS_API_KEY" in combined
              ),
              "no public long-lived key": (
                  "NEXT_PUBLIC_SPEECHMATICS_API_KEY" not in combined
              ),
              "temporary TTL is 60 seconds": (
                  "TOKEN_TTL_SECONDS = 60" in combined
              ),
              "partials handled": (
                  "AddPartialTranscript" in combined
              ),
              "finals handled": (
                  "AddTranscript" in combined
              ),
              "legacy browser recognizer removed": (
                  "webkitSpeechRecognition" not in combined
                  and "window.SpeechRecognition" not in combined
              ),
              "voice does not auto-investigate": (
                  "handleInvestigate(cleanedInput)" not in combined
              ),
          }

          failed = [
              name
              for name, passed in checks.items()
              if not passed
          ]

          for name, passed in checks.items():
              print(f"{'PASS' if passed else 'FAIL'}: {name}")

          if failed:
              raise SystemExit(
                  "Focused Speechmatics checks failed: "
                  + ", ".join(failed)
              )
          PY

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            frontend/package.json \
            frontend/package-lock.json \
            frontend/.env.example \
            frontend/public/speechmatics-pcm-worklet.js \
            frontend/src/app/page.tsx \
            frontend/src/app/api/speechmatics-token/route.ts \
            frontend/src/lib/useSpeechmaticsVoice.ts

          if git diff --cached --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi

          git commit -m "feat: integrate secure Speechmatics realtime voice input"
          git push
