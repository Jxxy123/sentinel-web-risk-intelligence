name: Bright Data MCP Normalized Search Validation

on:
  push:
    branches:
      - testing/enterprise-readiness
    paths:
      - backend/tools/run_brightdata_mcp_normalized_search.txt

permissions:
  contents: read

concurrency:
  group: brightdata-mcp-normalized-search-validation
  cancel-in-progress: false

jobs:
  normalized-mcp-search:
    name: One Normalized MCP Search
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONPATH: .
      EXECUTION_MODE: real
      BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
      BRIGHT_DATA_MCP_BASE_URL: ${{ vars.BRIGHT_DATA_MCP_BASE_URL || 'https://mcp.brightdata.com/mcp' }}
      BRIGHT_DATA_MCP_TOOLS: ${{ vars.BRIGHT_DATA_MCP_TOOLS }}
      BRIGHT_DATA_MCP_UNLOCKER_ZONE: ${{ vars.BRIGHT_DATA_MCP_UNLOCKER_ZONE }}
      BRIGHT_DATA_MCP_PRO: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify protected normalized MCP configuration
        run: |
          python - <<'PY'
          import os

          api_key = os.getenv(
              "BRIGHT_DATA_API_KEY",
              "",
          ).strip()
          base_url = os.getenv(
              "BRIGHT_DATA_MCP_BASE_URL",
              "",
          ).strip()
          tools = {
              tool.strip()
              for tool in os.getenv(
                  "BRIGHT_DATA_MCP_TOOLS",
                  "",
              ).split(",")
              if tool.strip()
          }

          missing = []

          if not api_key:
              missing.append(
                  "BRIGHT_DATA_API_KEY"
              )

          if not base_url:
              missing.append(
                  "BRIGHT_DATA_MCP_BASE_URL"
              )

          if "search_engine" not in tools:
              missing.append(
                  "search_engine in "
                  "BRIGHT_DATA_MCP_TOOLS"
              )

          if missing:
              raise SystemExit(
                  "Missing normalized MCP configuration: "
                  + ", ".join(missing)
              )

          if "token=" in base_url.lower():
              raise SystemExit(
                  "Do not store the API token inside "
                  "BRIGHT_DATA_MCP_BASE_URL."
              )

          print(
              "Protected normalized MCP "
              "configuration is present."
          )
          print(
              "API token: protected and present"
          )
          print(
              "Planned MCP sessions: 1"
          )
          print(
              "Planned search_engine calls: 1"
          )
          print(
              "Planned CrewAI and LLM calls: 0"
          )
          PY

      - name: Run one normalized MCP search validation
        run: python tools/brightdata_mcp_normalized_search_validation.py

      - name: Upload normalized MCP search results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-normalized-search-validation
          path: backend/artifacts/mcp_normalized_search_validation.json
          if-no-files-found: ignore
          retention-days: 7
