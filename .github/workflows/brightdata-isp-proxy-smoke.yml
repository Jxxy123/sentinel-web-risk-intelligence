name: Bright Data ISP Proxy Smoke Test

on:
  push:
    branches:
      - testing/enterprise-readiness
    paths:
      - backend/tools/run_brightdata_isp_proxy_smoke.txt

permissions:
  contents: read

jobs:
  live-isp-proxy-smoke:
    name: One Real ISP Proxy Request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: backend

    env:
      BRIGHT_DATA_ISP_PROXY_USER: ${{ secrets.BRIGHT_DATA_ISP_PROXY_USER }}
      BRIGHT_DATA_ISP_PROXY_PASS: ${{ secrets.BRIGHT_DATA_ISP_PROXY_PASS }}
      BRIGHT_DATA_PROXY_HOST: ${{ vars.BRIGHT_DATA_PROXY_HOST }}
      BRIGHT_DATA_PROXY_PORT: ${{ vars.BRIGHT_DATA_PROXY_PORT }}
      BRIGHT_DATA_ZONE: isp
      EXECUTION_MODE: real
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify protected ISP configuration
        run: |
          python - <<'PY'
          import os

          required_values = {
              "BRIGHT_DATA_ISP_PROXY_USER": os.getenv(
                  "BRIGHT_DATA_ISP_PROXY_USER"
              ),
              "BRIGHT_DATA_ISP_PROXY_PASS": os.getenv(
                  "BRIGHT_DATA_ISP_PROXY_PASS"
              ),
              "BRIGHT_DATA_PROXY_HOST": os.getenv(
                  "BRIGHT_DATA_PROXY_HOST"
              ),
              "BRIGHT_DATA_PROXY_PORT": os.getenv(
                  "BRIGHT_DATA_PROXY_PORT"
              ),
          }

          missing = [
              name
              for name, value in required_values.items()
              if not value
          ]

          if missing:
              raise SystemExit(
                  "Missing protected ISP configuration: "
                  + ", ".join(missing)
              )

          print("ISP Proxy configuration is present.")
          print(
              "Configured host: "
              + required_values["BRIGHT_DATA_PROXY_HOST"]
          )
          print(
              "Configured port: "
              + required_values["BRIGHT_DATA_PROXY_PORT"]
          )
          print("ISP username and password are protected.")
          print("Planned ISP requests: exactly 1")
          PY

      - name: Run controlled ISP Proxy smoke test
        run: python tools/brightdata_isp_proxy_smoke_test.py
