name: Confirmed Investigation Live Smoke Test

on:
  push:
    branches:
      - testing/enterprise-readiness
    paths:
      - backend/tools/run_confirmed_investigation_live_smoke.json

permissions:
  contents: read

concurrency:
  group: confirmed-investigation-live-smoke
  cancel-in-progress: false

jobs:
  confirmed-live-investigation:
    name: Identity to Report E2E
    runs-on: ubuntu-latest
    timeout-minutes: 18

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONPATH: .
      EXECUTION_MODE: real
      CONFIRMED_INVESTIGATION_CONFIG_FILE: tools/run_confirmed_investigation_live_smoke.json

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.aimlapi.com/v1' }}
      FREE_TIER_MODEL: ${{ vars.FREE_TIER_MODEL || 'meta-llama/Llama-3.3-70B-Instruct-Turbo' }}

      BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
      BRIGHT_DATA_SERP_ZONE: ${{ vars.BRIGHT_DATA_SERP_ZONE }}
      BRIGHT_DATA_WEB_UNLOCKER_ZONE: ${{ vars.BRIGHT_DATA_WEB_UNLOCKER_ZONE }}
      BRIGHT_DATA_MCP_BASE_URL: ${{ vars.BRIGHT_DATA_MCP_BASE_URL || 'https://mcp.brightdata.com/mcp' }}
      BRIGHT_DATA_MCP_TOOLS: ${{ vars.BRIGHT_DATA_MCP_TOOLS }}
      BRIGHT_DATA_MCP_UNLOCKER_ZONE: ${{ vars.BRIGHT_DATA_MCP_UNLOCKER_ZONE }}
      BRIGHT_DATA_MCP_PRO: "false"

      BRIGHT_DATA_PROXY_HOST: ${{ vars.BRIGHT_DATA_PROXY_HOST || 'brd.superproxy.io' }}
      BRIGHT_DATA_PROXY_PORT: ${{ vars.BRIGHT_DATA_PROXY_PORT || '33335' }}
      BRIGHT_DATA_PROXY_USER: ${{ secrets.BRIGHT_DATA_PROXY_USER }}
      BRIGHT_DATA_PROXY_PASS: ${{ secrets.BRIGHT_DATA_PROXY_PASS }}
      BRIGHT_DATA_ISP_PROXY_USER: ${{ secrets.BRIGHT_DATA_ISP_PROXY_USER }}
      BRIGHT_DATA_ISP_PROXY_PASS: ${{ secrets.BRIGHT_DATA_ISP_PROXY_PASS }}
      DATA_CENTER_PROXY: ${{ secrets.DATA_CENTER_PROXY }}
      ISP_PROXY: ${{ secrets.ISP_PROXY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify protected live configuration
        run: |
          python - <<'PY'
          import os

          required = {
              "OPENAI_API_KEY": os.getenv("OPENAI_API_KEY", "").strip(),
              "BRIGHT_DATA_API_KEY": os.getenv("BRIGHT_DATA_API_KEY", "").strip(),
              "BRIGHT_DATA_SERP_ZONE": os.getenv("BRIGHT_DATA_SERP_ZONE", "").strip(),
              "BRIGHT_DATA_MCP_BASE_URL": os.getenv("BRIGHT_DATA_MCP_BASE_URL", "").strip(),
          }
          missing = [name for name, value in required.items() if not value]
          if missing:
              raise SystemExit("Missing protected live configuration: " + ", ".join(missing))

          if "token=" in required["BRIGHT_DATA_MCP_BASE_URL"].lower():
              raise SystemExit("Do not place the API token inside BRIGHT_DATA_MCP_BASE_URL.")

          print("Protected live configuration is present.")
          print("Secrets remain masked.")
          PY

      - name: Run confirmed identity-to-report smoke test
        run: python tools/confirmed_investigation_live_smoke_test.py

      - name: Upload confirmed investigation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: confirmed-investigation-live-smoke
          path: backend/artifacts/confirmed_investigation_live_smoke.json
          if-no-files-found: error
          retention-days: 7
