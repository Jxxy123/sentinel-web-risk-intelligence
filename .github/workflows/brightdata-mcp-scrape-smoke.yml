name: Bright Data MCP Scraper Smoke Test

on:
  push:
    branches:
      - testing/enterprise-readiness
    paths:
      - backend/tools/run_brightdata_mcp_scrape_smoke.txt

permissions:
  contents: read

jobs:
  live-mcp-scraper-smoke:
    name: One Real MCP Scraper Call
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: backend

    env:
      BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
      BRIGHT_DATA_MCP_BASE_URL: ${{ vars.BRIGHT_DATA_MCP_BASE_URL }}
      BRIGHT_DATA_MCP_TOOLS: ${{ vars.BRIGHT_DATA_MCP_TOOLS }}
      BRIGHT_DATA_MCP_UNLOCKER_ZONE: ${{ vars.BRIGHT_DATA_MCP_UNLOCKER_ZONE }}
      BRIGHT_DATA_MCP_PRO: "false"
      EXECUTION_MODE: real
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify protected scraper configuration
        run: |
          python - <<'PY'
          import os

          api_key = os.getenv("BRIGHT_DATA_API_KEY")
          base_url = os.getenv("BRIGHT_DATA_MCP_BASE_URL")
          tools = os.getenv("BRIGHT_DATA_MCP_TOOLS", "")

          missing = []

          if not api_key:
              missing.append("BRIGHT_DATA_API_KEY")

          if not base_url:
              missing.append("BRIGHT_DATA_MCP_BASE_URL")

          if not tools:
              missing.append("BRIGHT_DATA_MCP_TOOLS")

          if missing:
              raise SystemExit(
                  "Missing MCP scraper configuration: "
                  + ", ".join(missing)
              )

          configured_tools = {
              tool.strip()
              for tool in tools.split(",")
              if tool.strip()
          }

          if "scrape_as_markdown" not in configured_tools:
              raise SystemExit(
                  "scrape_as_markdown is missing from "
                  "BRIGHT_DATA_MCP_TOOLS."
              )

          if "token=" in base_url:
              raise SystemExit(
                  "Do not place the API token inside "
                  "BRIGHT_DATA_MCP_BASE_URL."
              )

          print("MCP scraper configuration is present.")
          print("API token: protected and present")
          print("Required scraper: scrape_as_markdown")
          print("Planned scraper calls: exactly 1")
          print("Planned search calls: 0")
          PY

      - name: Run controlled MCP scraper test
        run: python tools/brightdata_mcp_scrape_smoke_test.py
