name: Bright Data SERP Smoke Test

on:
  push:
    branches:
      - testing/enterprise-readiness
    paths:
      - backend/tools/run_brightdata_smoke.txt

permissions:
  contents: read

jobs:
  live-serp-smoke:
    name: One Real SERP Request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: backend

    env:
      BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
      BRIGHT_DATA_SERP_ZONE: ${{ vars.BRIGHT_DATA_SERP_ZONE }}
      EXECUTION_MODE: real

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify protected configuration
        run: |
          python - <<'PY'
          import os

          if not os.getenv("BRIGHT_DATA_API_KEY"):
              raise SystemExit("Missing BRIGHT_DATA_API_KEY secret.")

          if not os.getenv("BRIGHT_DATA_SERP_ZONE"):
              raise SystemExit("Missing BRIGHT_DATA_SERP_ZONE variable.")

          print("Bright Data secret is present.")
          print(f"Configured SERP zone: {os.environ['BRIGHT_DATA_SERP_ZONE']}")
          print("Planned live requests: exactly 1")
          PY

      - name: Run controlled Bright Data smoke test
        run: python tools/brightdata_smoke_test.py
